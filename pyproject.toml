[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "open-mochi-prototype"
version = "0.2.0"
description = "Experimental open Mochi controller simulator and gateway"
requires-python = ">=3.10"
dependencies = ["fastapi>=0.110,<1", "uvicorn>=0.27,<1", "pydantic>=2,<3"]

[project.optional-dependencies]
serial = ["pyserial>=3.5,<4"]
ble = ["bleak>=0.22,<3"]
test = ["pytest>=8,<10", "httpx>=0.27,<1"]

[tool.setuptools.packages.find]
include = ["gateway*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
