name: Developer checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Python dependencies
        run: python -m pip install -e '.[test]'
      - name: Python and embedded-header conformance tests
        run: python -m pytest -q
      - name: Browser and Flipper script syntax
        run: |
          node --check web/app.js
          node --check flipper/mochi_control.js
      - name: Python compilation check
        run: python -m compileall -q gateway tools
